# Fixture provider only: use with the full production-shaped source-built app.
services:
  fixture:
    image: databridge-p0-baseline:local
    working_dir: /workspace
    command: [/app/.venv/bin/uvicorn, scripts.databridge_p1.fixture:app, --host, 0.0.0.0, --port, '8080']
    volumes: [.:/workspace:ro]
    networks: [egress]
    mem_limit: 512m
